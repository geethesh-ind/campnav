<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Canara Engineering College – Indoor Campus Navigation</title>
    <meta name="description" content="Official indoor navigation web app for Canara Engineering College. Fast, offline-capable multi-floor routing across classrooms, labs, HOD offices, and amenities." />
    <meta name="theme-color" content="#0f3b7a" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        const isDevHost =
          window.location.hostname === 'localhost' ||
          window.location.hostname === '127.0.0.1' ||
          window.location.port === '3000' ||
          window.location.port === '3001';

        window.addEventListener('load', () => {
          if (isDevHost) {
            navigator.serviceWorker.getRegistrations().then((regs) => {
              regs.forEach((reg) => reg.unregister());
            }).catch(() => {});
            if ('caches' in window) {
              caches.keys().then((keys) => keys.forEach((k) => caches.delete(k))).catch(() => {});
            }
          } else {
            navigator.serviceWorker.register('/sw.js').catch(() => {});
          }
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
